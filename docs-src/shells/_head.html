    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
        (function () {
            try {
                const theme = localStorage.getItem("quiz_theme_pref") || "light";
                const animations = localStorage.getItem("quiz_animations_pref") !== "disabled";
                const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
                document.documentElement.setAttribute("data-theme", theme);
                document.documentElement.setAttribute("data-animations", animations && !reduced ? "enabled" : "disabled");
                document.documentElement.setAttribute("data-motion", reduced ? "reduced" : "normal");
            } catch (_) { }
        })();
    </script>
