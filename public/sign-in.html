<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>تسجيل الدخول — بصمجي</title>

    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
        rel="stylesheet" />

    <!-- Shared styles -->
    <link rel="stylesheet" href="/src/styles/themes.css" />

    <!-- CRITICAL: Anti-flash theme script (must run before paint) -->
    <script>
        (function () {
            const t = localStorage.getItem("quiz_theme_pref") || "light";
            const a = localStorage.getItem("quiz_animations_pref") !== "disabled";
            document.documentElement.setAttribute("data-theme", t);
            if (!a) document.documentElement.setAttribute("data-animations", "disabled");
        })();
    </script>

    <!-- robots: no index for admin pages -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Preload critical resources -->
    <link rel="preload" href="/src/styles/sign-in.css" as="style">
    <link rel="stylesheet" href="/src/styles/sign-in.css">

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <div class="signin-card" role="main">
        <div class="signin-icon-wrapper">
            <div class="signin-icon" aria-hidden="true">
                <img src="/favicon.png" width="50px" height="50px" alt="Logo">
            </div>
        </div>
        <h1 class="signin-title" id="pageTitle">تسجيل الدخول</h1>
        <p class="signin-subtitle" id="pageSubtitle">أدخل بياناتك للمتابعة</p>

        <div class="tabs-container">
            <button type="button" class="tab-btn active" data-tab="access-code" id="tabAccessCode">تسجيل بكلمة
                السرّ</button>
            <button type="button" class="tab-btn" data-tab="email" id="tabEmail">تسجيل بالبريد</button>
        </div>

        <!-- Password (Admin) Form -->
        <form id="accessCodeForm" class="tab-content active" novalidate>
            <label class="field-label" for="adminIdInput">رمز الدخول</label>
            <div class="field-wrapper">
                <input id="adminIdInput" class="field-input" type="password" placeholder="••••••••••••"
                    autocomplete="current-password" autocorrect="off" autocapitalize="off" spellcheck="false" required
                    aria-describedby="errorMsgAccessCode" />
                <button type="button" class="toggle-visibility" id="toggleBtnAccessCode"
                    aria-label="إظهار/إخفاء رمز الدخول" title="إظهار/إخفاء">
                    <!-- Eye icon (hidden state) -->
                    <svg id="eyeIconAccessCode" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <!-- Eye-off icon (shown state) -->
                    <svg id="eyeOffIconAccessCode" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" style="display:none;">
                        <path
                            d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                        </path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
            </div>

            <button type="submit" class="signin-btn" id="submitBtnAccessCode">
                <span id="btnTextAccessCode">تسجيل الدخول</span>
                <div class="spinner" id="spinnerAccessCode"></div>
            </button>
            <div class="error-msg" id="errorMsgAccessCode" role="alert" aria-live="polite"></div>
        </form>

        <!-- Email Form -->
        <form id="emailForm" class="tab-content" novalidate style="display:none;">
            <label class="field-label" for="emailInput">البريد الإلكتروني</label>
            <div class="field-wrapper">
                <input id="emailInput" class="field-input email-input-ltr" type="email" placeholder="admin@example.com"
                    autocomplete="email" autocorrect="off" autocapitalize="off" spellcheck="false" required dir="ltr" />
            </div>

            <label class="field-label" for="emailPasswordInput">كلمة المرور</label>
            <div class="field-wrapper">
                <input id="emailPasswordInput" class="field-input" type="password" placeholder="••••••••••••"
                    autocomplete="current-password" autocorrect="off" autocapitalize="off" spellcheck="false"
                    required />
                <button type="button" class="toggle-visibility" id="toggleBtnEmail" aria-label="إظهار/إخفاء كلمة المرور"
                    title="إظهار/إخفاء">
                    <svg id="eyeIconEmail" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg id="eyeOffIconEmail" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" style="display:none;">
                        <path
                            d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                        </path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
            </div>

            <button type="submit" class="signin-btn" id="submitBtnEmail">
                <span id="btnTextEmail">تسجيل الدخول</span>
                <div class="spinner" id="spinnerEmail"></div>
            </button>

            <div class="error-msg" id="errorMsgEmail" role="alert" aria-live="polite"></div>

            <div class="divider">
                <span>أو الدخول بواسطة</span>
            </div>

            <div class="sso-buttons">
                <button type="button" class="sso-btn" id="btnMicrosoft">
                    <span>Microsoft</span>
                    <svg width="18" height="18" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10 0H0V10H10V0Z" fill="#F25022" />
                        <path d="M21 0H11V10H21V0Z" fill="#7FBA00" />
                        <path d="M10 11H0V21H10V11Z" fill="#00A4EF" />
                        <path d="M21 11H11V21H21V11Z" fill="#FFB900" />
                    </svg>
                </button>
                <button type="button" class="sso-btn" id="btnGoogle">
                    <span>Google</span>
                    <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#EA4335"
                            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.73 17.74 9.5 24 9.5z" />
                        <path fill="#4285F4"
                            d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                        <path fill="#FBBC05"
                            d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                        <path fill="#34A853"
                            d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                    </svg>
                </button>
            </div>
        </form>

        <a href="/" class="back-link">← العودة إلى الصفحة الرئيسية</a>
    </div>

    <!-- Scripts -->
    <script type="module" src="/src/scripts/sign-in.js"></script>
</body>

</html>
