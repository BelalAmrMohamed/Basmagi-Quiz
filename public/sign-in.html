<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>تسجيل الدخول | منصة إمتحانات بصمجي</title>

    <meta name="description" content="صفحة تسجيل الدخول في منصة إمتحانات بصمجي" />
    <meta name="keywords" content="بصمجي، تسجيل الدخول، منصة إمتحانات، اختبارات إلكترونية" />
    <meta name="author" content="بلال عمرو محمد" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1a1a2e" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="تسجيل الدخول | منصة إمتحانات بصمجي" />
    <meta property="og:description" content="تسجيل الدخول المخصص للمشرفين في منصة إمتحانات بصمجي" />
    <meta property="og:image" content="https://basmagi-quiz.vercel.app/assets/images/thumbnails/sign-in-thumbnail.png?v=3">
    <meta property="og:url" content="https://basmagi-quiz.vercel.app/sign-in.html">
    <meta property="og:logo" content="https://basmagi-quiz.vercel.app/favicon.png" />
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="تسجيل الدخول | منصة إمتحانات بصمجي">
    <meta property="og:site_name" content="منصة إمتحانات بصمجي">
    <meta property="og:locale" content="ar_AR">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@BelalAmrDev">
    <meta name="twitter:creator" content="@BelalAmrDev">
    <meta name="twitter:title" content="تسجيل الدخول | منصة إمتحانات بصمجي" />
    <meta name="twitter:description" content="تسجيل دخول منصة إمتحانات بصمجي" />
    <meta name="twitter:image" content="https://basmagi-quiz.vercel.app/assets/images/thumbnails/sign-in-thumbnail.png?v=3">
    <meta name="twitter:image:alt" content="منصة إمتحانات بصمجي">

    <!-- Canonical -->
    <link rel="canonical" href="/sign-in.html" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />

    <!-- robots: no index for admin pages -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="stylesheet" href="/src/styles/sign-in.css">

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <!-- ── Split-screen shell ── -->
    <div class="split-screen">

        <!-- LEFT PANEL: Sign-in form -->
        <div class="panel panel-form">
            <div class="form-inner">

                <!-- Small logo mark for mobile / form panel -->
                <div class="brand-mark">
                    <img src="/favicon.png" width="36" height="36" alt="بصمجي">
                    <span class="brand-mark-name">منصة إمتحانات بصمجي</span>
                </div>

                <h1 class="signin-title" id="pageTitle">تسجيل الدخول</h1>
                <p class="signin-subtitle" id="pageSubtitle">أدخل بياناتك للمتابعة</p>

                <div class="tabs-container">
                    <button type="button" class="tab-btn active" data-tab="access-code" id="tabAccessCode">
                        تسجيل بكلمة السرّ
                    </button>
                    <button type="button" class="tab-btn" data-tab="email" id="tabEmail">
                        تسجيل بالبريد
                    </button>
                </div>

                <!-- Password (Admin) Form -->
                <form id="accessCodeForm" class="tab-content active" novalidate>
                    <label class="field-label" for="adminIdInput">رمز الدخول</label>
                    <div class="field-wrapper">
                        <input id="adminIdInput" class="field-input" type="password" placeholder="••••••••••••"
                            autocomplete="current-password" autocorrect="off" autocapitalize="off" spellcheck="false"
                            required aria-describedby="errorMsgAccessCode" />
                        <button type="button" class="toggle-visibility" id="toggleBtnAccessCode"
                            aria-label="إظهار/إخفاء رمز الدخول" title="إظهار/إخفاء">
                            <svg id="eyeIconAccessCode" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg id="eyeOffIconAccessCode" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                                </path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>

                    <button type="submit" class="signin-btn" id="submitBtnAccessCode">
                        <span id="btnTextAccessCode">تسجيل الدخول</span>
                        <div class="spinner" id="spinnerAccessCode"></div>
                    </button>
                    <div class="error-msg" id="errorMsgAccessCode" role="alert" aria-live="polite"></div>
                </form>

                <!-- Email Form -->
                <form id="emailForm" class="tab-content" novalidate style="display:none;">
                    <div id="emailStep">
                        <label class="field-label" for="emailInput">البريد الإلكتروني</label>
                        <div class="field-wrapper">
                            <input id="emailInput" class="field-input email-input-ltr" type="email"
                                placeholder="admin@example.com" autocomplete="email" autocorrect="off" autocapitalize="off"
                                spellcheck="false" required dir="ltr" />
                        </div>

                        <button type="submit" class="signin-btn" id="submitBtnEmail">
                            <span id="btnTextEmail">إرسال رمز التحقق</span>
                            <div class="spinner" id="spinnerEmail"></div>
                        </button>
                    </div>

                    <div id="otpStep" style="display:none;">
                        <label class="field-label" for="otpInput">رمز التحقق (OTP)</label>
                        <div class="field-wrapper">
                            <input id="otpInput" class="field-input otp-input-ltr" type="text"
                                placeholder="••••••" autocomplete="one-time-code" autocorrect="off" autocapitalize="off"
                                spellcheck="false" inputmode="numeric" pattern="[0-9]*" maxlength="6" dir="ltr" />
                        </div>

                        <button type="button" class="signin-btn" id="submitBtnOtp">
                            <span id="btnTextOtp">تأكيد رمز التحقق</span>
                            <div class="spinner" id="spinnerOtp"></div>
                        </button>

                        <div class="otp-actions">
                            <button type="button" class="link-btn" id="resendOtpBtn">إعادة إرسال الرمز</button>
                            <span class="footer-sep">•</span>
                            <button type="button" class="link-btn" id="changeEmailBtn">تغيير البريد الإلكتروني</button>
                        </div>
                    </div>

                    <div class="error-msg" id="errorMsgEmail" role="alert" aria-live="polite"></div>
                    <div class="success-msg" id="successMsgEmail" role="alert" aria-live="polite" style="display:none;"></div>

                    <div class="divider" id="ssoDivider"><span>أو الدخول بواسطة</span></div>

                    <div class="sso-buttons" id="ssoButtonsContainer">
                        <button type="button" class="sso-btn" id="btnGitHub">
                            <span>GitHub</span>
                            <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path fill="currentColor" d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.268 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.026 2.747-1.026.546 1.379.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.161 22 16.416 22 12c0-5.523-4.477-10-10-10z"/>
                            </svg>
                        </button>
                        <button type="button" class="sso-btn" id="btnGoogle">
                            <span>Google</span>
                            <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                                <path fill="#EA4335"
                                    d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.73 17.74 9.5 24 9.5z" />
                                <path fill="#4285F4"
                                    d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                                <path fill="#FBBC05"
                                    d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                                <path fill="#34A853"
                                    d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                            </svg>
                        </button>
                    </div>
                </form>

                <div class="form-footer">
                    <a href="/" class="back-link">← العودة إلى الصفحة الرئيسية</a>
                    <div class="footer-links">
                        <a href="https://portfolio-of-belal.vercel.app/" class="footer-link">المطور</a>
                        <span class="footer-sep">•</span>
                        <a href="/privacy-policy.html" class="footer-link">سياسة الخصوصية</a>
                        <span class="footer-sep">•</span>
                        <a href="/terms-of-service.html" class="footer-link">شروط الخدمة</a>
                    </div>
                </div>

            </div>
        </div>

        <!-- RIGHT PANEL: Brand / logo wall -->
        <div class="panel panel-brand" aria-hidden="true">
            <div class="brand-wall">
                <div class="brand-glow"></div>
                <img src="/favicon.png" class="brand-logo-img" alt="شعار بصمجي" />
                <p class="brand-tagline">منصة إمتحانات بصمجي</p>
                <p class="brand-sub">بوابة تسجيل الدخول</p>
            </div>
            <!-- Subtle grid overlay -->
            <div class="brand-grid" aria-hidden="true"></div>
        </div>

    </div>

    <!-- Scripts -->
    <script type="module" src="/src/scripts/sign-in.js"></script>
</body>

</html>
