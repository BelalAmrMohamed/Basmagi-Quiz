<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fafbfc">
  <title>غير متصل — منصة امتحانات بصمجي</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://basmagi.vercel.app/offline">
  <style>
    :root {
      color-scheme: light;
      --page: #fafbfc;
      --surface: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --error-bg: #fef2f2;
      --error: #b91c1c;
      --focus: rgba(99, 102, 241, .35);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --page: #0a0a0a;
      --surface: #121212;
      --text: #ededed;
      --muted: #a3a3a3;
      --border: #262626;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --error-bg: rgba(239, 68, 68, .14);
      --error: #fca5a5;
      --focus: rgba(59, 130, 246, .45);
    }

    html[data-theme="dark-slate"] {
      color-scheme: dark;
      --page: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --error-bg: rgba(239, 68, 68, .16);
      --error: #fca5a5;
      --focus: rgba(99, 102, 241, .45);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: var(--page);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      transition: background-color .2s ease, color .2s ease;
    }

    main {
      width: min(100%, 420px);
      padding: 36px 32px 32px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 12px 36px rgba(15, 23, 42, .07);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 30px;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 600;
    }

    .brand img { width: 24px; height: 24px; border-radius: 6px; }

    .icon {
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: color-mix(in srgb, var(--primary) 10%, var(--surface));
      color: var(--primary);
    }

    .icon svg { width: 32px; height: 32px; }
    h1 { margin: 0 0 10px; font-size: 1.4rem; line-height: 1.45; }
    .description { margin: 0; color: var(--muted); line-height: 1.8; font-size: .98rem; }

    .status {
      margin: 18px 0 0;
      padding: 11px 13px;
      border-radius: 10px;
      color: var(--error);
      background: var(--error-bg);
      line-height: 1.65;
      font-size: .9rem;
      text-align: right;
    }

    .status:empty { display: none; }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 24px;
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background-color .15s ease, transform .15s ease;
    }

    button:hover:not(:disabled) { background: var(--primary-hover); }
    button:active:not(:disabled) { transform: scale(.985); }
    button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    button:disabled { opacity: .75; cursor: wait; }

    @media (max-width: 480px) {
      body { padding: 16px; }
      main { padding: 30px 22px 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">
      <img src="/favicon.png" alt="" width="24" height="24" onerror="this.style.display='none'">
      <span>منصة امتحانات بصمجي</span>
    </div>

    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 8.8a16 16 0 0 1 20 0M5 12.5a10.8 10.8 0 0 1 14 0M8.7 16.2a5.3 5.3 0 0 1 6.6 0"></path>
        <path d="m3 3 18 18"></path>
        <circle cx="12" cy="20" r=".8" fill="currentColor" stroke="none"></circle>
      </svg>
    </div>

    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p class="description">تحقق من اتصالك بالشبكة، ثم أعد المحاولة للعودة إلى المنصة.</p>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <button type="button" id="retry-btn">إعادة المحاولة</button>
  </main>

  <script>
    (() => {
      const THEME_KEY = "quiz_theme_pref";
      const themes = ["light", "dark", "dark-slate"];
      const root = document.documentElement;
      const button = document.getElementById("retry-btn");
      const status = document.getElementById("status");

      // Match the platform's saved theme; standalone/offline visits default to light.
      try {
        const savedTheme = localStorage.getItem(THEME_KEY);
        root.dataset.theme = themes.includes(savedTheme) ? savedTheme : "light";
      } catch (_) {
        root.dataset.theme = "light";
      }

      function redirectBack() {
        const referrer = document.referrer;
        if (referrer && referrer.indexOf(location.origin) === 0) {
          location.replace(referrer);
        } else {
          location.replace("/");
        }
      }

      async function checkServer() {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 5000);
        try {
          const response = await fetch("/favicon.png?_=" + Date.now(), {
            method: "HEAD",
            cache: "no-store",
            signal: controller.signal
          });
          return response.ok ? "connected" : "server-error";
        } catch (error) {
          return error.name === "AbortError" ? "timeout" : "unreachable";
        } finally {
          clearTimeout(timeout);
        }
      }

      async function retry() {
        if (button.disabled) return;
        status.textContent = "جارٍ التحقق من الاتصال…";
        status.style.color = "var(--muted)";
        status.style.background = "transparent";
        button.disabled = true;
        button.textContent = "جارٍ التحقق…";

        let result;
        if (!navigator.onLine) {
          result = "offline";
        } else {
          result = await checkServer();
        }

        if (result === "connected") {
          redirectBack();
          return;
        }

        const messages = {
          offline: "ما زال جهازك غير متصل بالشبكة. تحقق من الواي فاي أو بيانات الهاتف ثم حاول مجددًا.",
          timeout: "استغرق الاتصال بخادم المنصة وقتًا أطول من المعتاد. تحقق من الشبكة وحاول مجددًا.",
          unreachable: "تعذر الوصول إلى خادم المنصة. قد يكون اتصالك غير مستقر؛ تحقق منه ثم حاول مجددًا.",
          "server-error": "وصلنا إلى الخادم، لكنه لم يتمكن من إكمال الطلب الآن. حاول مرة أخرى بعد قليل."
        };
        status.textContent = messages[result];
        status.style.color = "";
        status.style.background = "";
        button.disabled = false;
        button.textContent = "إعادة المحاولة";
      }

      button.addEventListener("click", retry);
      window.addEventListener("online", async () => {
        if (await checkServer() === "connected") redirectBack();
      });

      if (navigator.onLine) {
        checkServer().then((result) => {
          if (result === "connected") redirectBack();
        });
      }
    })();
  </script>
</body>
</html>
