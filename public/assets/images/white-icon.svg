<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 540" width="100%" height="100%">
  <defs>
    <!-- Glass Bulb Gradient -->
    <radialGradient id="bulbGrad" cx="35%" cy="30%" r="70%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#eef2f6" />
      <stop offset="85%" stop-color="#ced5e0" />
      <stop offset="100%" stop-color="#b4becd" />
    </radialGradient>

    <!-- Bottom Neck Shadow Gradient -->
    <linearGradient id="neckShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ced5e0" stop-opacity="0" />
      <stop offset="100%" stop-color="#9aa5b6" stop-opacity="0.7" />
    </linearGradient>

    <!-- Metallic Screw Base Cylinder Gradient -->
    <linearGradient id="metalBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#79828f" />
      <stop offset="25%" stop-color="#9ca5b3" />
      <stop offset="55%" stop-color="#d4dbe3" />
      <stop offset="80%" stop-color="#8b94a2" />
      <stop offset="100%" stop-color="#616a77" />
    </linearGradient>

    <!-- Metallic Thread Ridge Gradient -->
    <linearGradient id="metalRidge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5d6572" />
      <stop offset="30%" stop-color="#828b99" />
      <stop offset="55%" stop-color="#b8c1cd" />
      <stop offset="85%" stop-color="#6e7785" />
      <stop offset="100%" stop-color="#4c5460" />
    </linearGradient>

    <!-- Bottom Contact Tip Gradient -->
    <linearGradient id="contactTip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#374151" />
    </linearGradient>
  </defs>

  <!-- Radiating Light Rays -->
  <g fill="#e5e9f0">
    <!-- Top Center (Short) -->
    <rect x="244" y="10" width="12" height="34" rx="5" />
    <!-- Top Left (Short) -->
    <rect x="244" y="10" width="12" height="34" rx="5" transform="rotate(-30 250 205)" />
    <!-- Top Right (Short) -->
    <rect x="244" y="10" width="12" height="34" rx="5" transform="rotate(30 250 205)" />

    <!-- Upper Left (Long) -->
    <rect x="38" y="88" width="66" height="24" rx="6" transform="rotate(42 71 100)" />
    <!-- Middle Left (Long) -->
    <rect x="10" y="196" width="62" height="24" rx="6" />
    <!-- Lower Left (Long) -->
    <rect x="40" y="302" width="66" height="24" rx="6" transform="rotate(-42 73 314)" />

    <!-- Upper Right (Long) -->
    <rect x="396" y="88" width="66" height="24" rx="6" transform="rotate(-42 429 100)" />
    <!-- Middle Right (Long) -->
    <rect x="428" y="196" width="62" height="24" rx="6" />
    <!-- Lower Right (Long) -->
    <rect x="394" y="302" width="66" height="24" rx="6" transform="rotate(42 427 314)" />
  </g>

  <!-- Lightbulb Glass Body -->
  <path d="M 250 68 
           C 168 68, 108 130, 108 208 
           C 108 258, 134 294, 160 328 
           C 178 352, 183 375, 185 398 
           C 186 408, 193 414, 203 414 
           L 297 414 
           C 307 414, 314 408, 315 398 
           C 317 375, 322 352, 340 328 
           C 366 294, 392 258, 392 208 
           C 392 130, 332 68, 250 68 Z" fill="url(#bulbGrad)" />

  <!-- Subtle Neck Shading -->
  <path d="M 160 328 
           C 178 352, 183 375, 185 398 
           C 186 408, 193 414, 203 414 
           L 297 414 
           C 307 414, 314 408, 315 398 
           C 317 375, 322 352, 340 328 Z" fill="url(#neckShadow)" />

  <!-- Glossy Highlights on Top-Left of Bulb -->
  <ellipse cx="171" cy="118" rx="22" ry="14" transform="rotate(-38 171 118)" fill="#ffffff" opacity="0.85" />
  <ellipse cx="143" cy="153" rx="14" ry="9" transform="rotate(-55 143 153)" fill="#ffffff" opacity="0.85" />

  <!-- Dark Navy Question Mark -->
  <g fill="#080e1d">
    <!-- Top Hook -->
    <path d="M 200 192 
             L 223 192 
             C 226 192, 228 190, 228 187 
             C 228 168, 236 158, 250 158 
             C 263 158, 270 166, 270 179 
             C 270 190, 264 198, 251 208 
             C 236 220, 232 232, 232 254 
             L 232 259 
             C 232 262, 234 264, 237 264 
             L 261 264 
             C 264 264, 266 262, 266 259 
             L 266 253 
             C 266 240, 271 232, 284 222 
             C 299 210, 305 196, 305 178 
             C 305 147, 282 126, 250 126 
             C 215 126, 195 149, 195 186 
             C 195 190, 197 192, 200 192 Z" />
    <!-- Bottom Square Dot -->
    <rect x="232" y="281" width="34" height="34" rx="4" />
  </g>

  <!-- Metallic Screw Base & Bottom Contact -->
  <g>
    <!-- Bottom Contact Tip -->
    <path d="M 218 504 C 228 525, 272 525, 282 504 Z" fill="url(#contactTip)" />

    <!-- Main Screw Base Cylinder -->
    <path d="M 190 414 
             L 310 414 
             L 310 434 
             L 304 442 
             L 304 454 
             L 304 466 
             L 304 478 
             C 304 494, 290 506, 270 506 
             L 230 506 
             C 210 506, 196 494, 196 478 
             L 196 442 
             L 190 434 Z" fill="url(#metalBase)" />

    <!-- Screw Thread Ridges (Angled) -->
    <rect x="189" y="431" width="122" height="12" rx="6" transform="rotate(-4.5 250 437)" fill="url(#metalRidge)" />
    <rect x="189" y="453" width="122" height="12" rx="6" transform="rotate(-4.5 250 459)" fill="url(#metalRidge)" />
    <rect x="192" y="475" width="116" height="12" rx="6" transform="rotate(-4.5 250 481)" fill="url(#metalRidge)" />
  </g>
</svg>