<body>
    <!-- CRITICAL: Anti-flash sidebar-state script — must run before the
         sidebar/body markup below paints, or the sidebar briefly renders
         collapsed (64px) before snapping to its saved expanded (240px)
         state on desktop. This is a synchronous, non-module, non-deferred
         script placed as the very first thing in <body> — it runs the
         instant the parser reaches this point, before the .sidebar element
         a few lines down (or anything after it) is painted.
         side-menu.js's init() reads window.__sidebarExpandedInit instead of
         re-deriving this, so the two never disagree. -->
    <script>
        (function () {
            try {
                var MOBILE_BP = 768;
                var isMobile = window.innerWidth <= MOBILE_BP;
                var saved = localStorage.getItem("sidebar_expanded");
                var expanded = !isMobile && (saved === "true");
                window.__sidebarExpandedInit = expanded;
                if (expanded) {
                    document.body.classList.add("sidebar-expanded");
                }
                // The .sidebar element itself is added a few lines below;
                // side-menu.js's init() applies the "expanded" class to it
                // synchronously on DOMContentLoaded using the same value —
                // by then the body padding above has already been correct
                // since first paint, which is what prevents the visible jump.
            } catch (e) {
                console.error("Sidebar state initialization error:", e);
            }
        })();
    </script>

                        <span class="toggle-switch" aria-hidden="true"></span>
                    </label>

                    <label class="animation-toggle-container high-performance-toggle-container sidebar-expanded-only"
                        title="إيقاف كل الرسوم المتحركة والانتقالات في الموقع بالكامل لأفضل أداء ممكن">
                        <span class="animation-toggle-label">الأداء الفائق</span>
                        <input type="checkbox" id="highPerformanceToggle" class="toggle-input"
                            data-control="high-performance" aria-label="تفعيل الأداء الفائق (إيقاف كل الحركات)">
                        <span class="toggle-switch" aria-hidden="true"></span>
                    </label>
                </div>
            </div>

            <div class="menu-divider sidebar-expanded-only"></div>

            <button id="viewToggle" class="menu-item view-toggle-btn sidebar-expanded-only" data-tooltip="شكل القائمة">
                <span id="viewIcon"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 5h.01M3 12h.01M3 19h.01M8 5h13M8 12h13M8 19h13" />
                    </svg></span>
                <span class="menu-label" id="viewText">شكل القائمة</span>
            </button>

            <div class="menu-divider sidebar-expanded-only"></div>

            <!-- List or Grid view navigations get displayed here -->
            <div id="menuNavContainer" class="sidebar-expanded-only">
            </div>
            <div class="menu-divider sidebar-expanded-only"></div>
        </nav>
    </aside>

    <div class="container">
        <!-- The top header containing the title and timer, etc... -->
        <div class="header">
            <div class="header-top">
                <div class="header-title-section">
                    <div class="title-date-container">
                        <h1 id="quizTitle">...جاري التحميل</h1>
                        <button class="quiz-info-btn" id="quizInfoBtn" aria-label="معلومات الاختبار"
                            aria-haspopup="dialog" type="button" title="معلومات الإختبار">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <circle cx="12" cy="12" r="10" />
                                <path d="M12 16v-4M12 8h.01" />
                            </svg>
                        </button>
                    </div>

                    <!-- Hidden data containers preserved for JS compatibility -->
                    <div id="quizDescription" style="display:none;"></div>
                    <div id="quizSource" style="display:none;"></div>
                    <div id="dateBadge" style="display:none;"><span id="quizDate"></span></div>
                    <div id="quizBreadcrumb" style="display:none;"></div>

                    <div class="header-subtitle">
                        <div class="timer-badge" id="timerBadge">
                            <svg class="timer-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            <span id="timer">00:00</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="progress-section">
                <div class="progress-header">
                    <span class="progress-percentage" id="progressText">0% (0/0)</span>
                    <span class="progress-label">:التقدم</span>
                </div>
                <div class="progress-container">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>

        <!-- The questions get displayed here from the javascript -->
        <div id="questionContainer" class="loading">
            <p>جاري تحضير الإختبار</p>
        </div>

        <!-- navigation buttons at the bottom -->
        <div class="navigation">
            <button class="nav-btn" id="nextBtn" title="→ السؤال التالي" onclick="nextQuestion()">
                → التالي
            </button>
            <button class="nav-btn" id="prevBtn" title="السؤال السابق ←" onclick="prevQuestion()" disabled>
                السابق ←
            </button>
        </div>
    </div>

    <!-- Quiz Information Dialog (Shell populated by JS) -->
    <dialog class="quiz-info-dialog" id="quizInfoDialog" aria-labelledby="quizInfoDialogTitle"></dialog>

    <script type="module" src="src/features/quiz/quiz.js"></script>
    <script type="module">
        import { getShortcutModalHTML } from './src/scripts/keyboard-nav.js';
        document.body.insertAdjacentHTML('beforeend', getShortcutModalHTML());
    </script>
    <script type="module">
        import { initPWA } from "./src/shared/pwa-manager.js";
        document.addEventListener("DOMContentLoaded", () => initPWA());
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>

</html>
