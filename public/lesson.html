  <!-- CRITICAL: Anti-flash sidebar-state script — must run before the
         sidebar/body markup below paints, or the sidebar briefly renders
         collapsed (64px) before snapping to its saved expanded (240px)
         state on desktop. This is a synchronous, non-module, non-deferred
         script placed as the very first thing in <body> — it runs the
         instant the parser reaches this point, before the .sidebar element
         a few lines down (or anything after it) is painted.
         side-menu.js's init() reads window.__sidebarExpandedInit instead of
         re-deriving this, so the two never disagree. -->
  <script>
    (function () {
      try {
        var MOBILE_BP = 768;
        var isMobile = window.innerWidth <= MOBILE_BP;
        var saved = localStorage.getItem("sidebar_expanded");
        var expanded = !isMobile && (saved === "true");
        window.__sidebarExpandedInit = expanded;
        if (expanded) {
          document.body.classList.add("sidebar-expanded");
        }
        // The .sidebar element itself is added a few lines below;
        // side-menu.js's init() applies the "expanded" class to it
        // synchronously on DOMContentLoaded using the same value —
        // by then the body padding above has already been correct
        // since first paint, which is what prevents the visible jump.
      } catch (e) {
        console.error("Sidebar state initialization error:", e);
      }
    })();
  </script>
