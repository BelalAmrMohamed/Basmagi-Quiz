<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basmagi 3D Logo – Demo</title>
  <style>
    /* ─── Reset & Base ──────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      /* Rich dark gradient — matches the ToS brand's #1a1a2e deep navy */
      background: radial-gradient(ellipse at 60% 30%, #2d2f4a 0%, #1a1a2e 55%, #0e0e1c 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
      overflow: hidden;
    }

    /* ─── Canvas sits as a background layer ─────────────────── */
    #logo-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none; /* let clicks pass through to UI */
    }

    /* ─── Foreground UI overlay ──────────────────────────────── */
    .ui-overlay {
      position: relative;
      z-index: 1;
      text-align: center;
      color: #f0f0f8;
      user-select: none;
      padding: 24px;
    }

    .brand-label {
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 10px;
    }

    .brand-title {
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 700;
      color: #ffffff;
      line-height: 1.25;
      text-shadow: 0 2px 24px rgba(0,0,0,0.55);
    }

    .brand-sub {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #6b7280;
    }

    /* ─── Subtle vignette to ground the scene ───────────────── */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(14,14,28,0.72) 100%);
      z-index: 0;
    }
  </style>
</head>
<body>

  <!-- Three.js renders into this canvas; alpha:true keeps it transparent -->
  <canvas id="logo-canvas"></canvas>

  <!-- Demo foreground text — remove or replace in your actual page -->
  <div class="ui-overlay">
    <p class="brand-label">منصة إمتحانات</p>
    <h1 class="brand-title">بصمجي</h1>
    <p class="brand-sub">اختبر نفسك. طوّر معرفتك.</p>

    /* ════════════════════════════════════════════════════════════
       SCENE SETUP
    ════════════════════════════════════════════════════════════ */

    const canvas  = document.getElementById('logo-canvas');
    const W       = () => window.innerWidth;
    const H       = () => window.innerHeight;

    /* Renderer ─────────────────────────────────────────────── */
    const renderer = new THREE.WebGLRenderer({
      canvas,
      alpha:     true,   // transparent background → blends with body CSS
      antialias: true,
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(W(), H());
    renderer.shadowMap.enabled  = true;
    renderer.shadowMap.type     = THREE.PCFSoftShadowMap;
    renderer.toneMapping        = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    /* Scene ────────────────────────────────────────────────── */
    const scene = new THREE.Scene();
    // No scene background — renderer alpha handles transparency

    /* Camera ───────────────────────────────────────────────── */
    const camera = new THREE.PerspectiveCamera(45, W() / H(), 0.1, 2000);
    camera.position.set(0, 0, 400); // pulled back; we'll adjust after centering

    /* ════════════════════════════════════════════════════════════
       LIGHTS  —  "premium studio" three-point setup
    ════════════════════════════════════════════════════════════ */

    // 1. Ambient — lifts shadows, keeps dark side visible
    const ambientLight = new THREE.AmbientLight(0xb0b4d0, 0.55);
    scene.add(ambientLight);

    // 2. Key light — cool-white directional, casts shadows
    const keyLight = new THREE.DirectionalLight(0xd4daff, 2.2);
    keyLight.position.set(120, 180, 200);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far  = 800;
    scene.add(keyLight);

    // 3. Fill light — warm from below-left, simulates environmental bounce
    const fillLight = new THREE.DirectionalLight(0xffd6a5, 0.65);
    fillLight.position.set(-150, -80, 80);
    scene.add(fillLight);

    // 4. Dynamic rim / specular point light — orbits with the logo rotation
    //    giving the clearcoat that moving highlight
    const rimLight = new THREE.PointLight(0x7eb8ff, 3.5, 600, 1.4);
    rimLight.position.set(-100, 60, 180);
    scene.add(rimLight);

    /* ════════════════════════════════════════════════════════════
       MATERIAL  —  MeshPhysicalMaterial for clearcoat sheen
    ════════════════════════════════════════════════════════════ */
    const logoMaterial = new THREE.MeshPhysicalMaterial({
      color:          0x3a3d6e,   // deep indigo-violet, matches brand palette
      metalness:      0.72,
      roughness:      0.22,
      clearcoat:      1.0,        // glossy top-coat layer
      clearcoatRoughness: 0.08,
      reflectivity:   0.9,
      envMapIntensity: 1.0,
      side:           THREE.DoubleSide,
    });

    // Subtle bevel-face material — slightly lighter, gives the edge a lift
    const bevelMaterial = new THREE.MeshPhysicalMaterial({
      color:          0x5c60a0,
      metalness:      0.5,
      roughness:      0.3,
      clearcoat:      0.6,
      clearcoatRoughness: 0.15,
      side: THREE.DoubleSide,
    });

    /* ════════════════════════════════════════════════════════════
       SVG → 3D EXTRUSION
    ════════════════════════════════════════════════════════════ */

    /**
     * buildLogoMesh()
     * Parses the embedded SVG, converts each path to a Three.js Shape,
     * extrudes with bevel, groups all meshes, then centres the group
     * on its own bounding-box centroid so rotation is around true centre.
     */
    function buildLogoMesh() {
      const loader = new SVGLoader();
      const svgData = loader.parse(SVG_STRING);

      // ExtrudeGeometry settings
      const extrudeSettings = {
        depth:          14,          // Z-axis thickness
        bevelEnabled:   true,
        bevelThickness: 2.2,         // how far the bevel reaches into the extrusion
        bevelSize:      1.6,         // how far it spreads laterally
        bevelOffset:    0,
        bevelSegments:  5,           // smooth arc; more = rounder but heavier
      };

      const group = new THREE.Group();

      svgData.paths.forEach((path) => {
        // SVGLoader gives us sub-paths; turn each into a Shape + holes
        const shapes = SVGLoader.createShapes(path);

        shapes.forEach((shape) => {
          const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);

          // MeshPhysicalMaterial accepts an array of materials:
          //   index 0 → front/back face
          //   index 1 → bevel/side faces
          const mesh = new THREE.Mesh(geometry, [logoMaterial, bevelMaterial]);
          mesh.castShadow    = true;
          mesh.receiveShadow = true;
          group.add(mesh);
        });
      });

      /* ── Centre the group ──────────────────────────────────
         SVG coords start at (0,0) = top-left, so the raw geometry
         is offset. We compute the bounding box and translate every
         child so the group pivot sits exactly at the centroid.
      ──────────────────────────────────────────────────────── */
      const box = new THREE.Box3().setFromObject(group);
      const centre = new THREE.Vector3();
      box.getCenter(centre);

      // Shift all children so their collective centroid is at origin
      group.children.forEach((child) => {
        child.position.sub(centre);
      });

      /* ── SVG Y-axis is flipped relative to Three.js ────── */
      group.scale.y = -1;

      /* ── Uniform scale to fit nicely in the viewport ────── */
      const size = new THREE.Vector3();
      box.getSize(size);
      const maxDim = Math.max(size.x, size.y);

      // Target: logo fills ~55 % of the shorter viewport dimension
      const targetPx  = Math.min(W(), H()) * 0.55;
      // Convert px target to world units at z=0 plane
      const fovRad     = THREE.MathUtils.degToRad(camera.fov);
      const worldHeight = 2 * Math.tan(fovRad / 2) * camera.position.z;
      const pxPerUnit  = H() / worldHeight;
      const targetUnits = targetPx / pxPerUnit;

      const scaleFactor = targetUnits / maxDim;
      group.scale.x = scaleFactor;
      group.scale.y = -scaleFactor; // keep Y-flip

      return group;
    }

    /* ════════════════════════════════════════════════════════════
       BUILD & ADD TO SCENE
    ════════════════════════════════════════════════════════════ */
    const logoGroup = buildLogoMesh();
    scene.add(logoGroup);

    /* ════════════════════════════════════════════════════════════
       SUBTLE FLOATING PARTICLES  —  ambient depth cue
    ════════════════════════════════════════════════════════════ */
    (function addParticles() {
      const count    = 120;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);

      for (let i = 0; i < count; i++) {
        positions[i * 3    ] = (Math.random() - 0.5) * 600;
        positions[i * 3 + 1] = (Math.random() - 0.5) * 500;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 400;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const material = new THREE.PointsMaterial({
        color: 0x7eb8ff,
        size:  1.4,
        sizeAttenuation: true,
        transparent: true,
        opacity: 0.35,
      });

      scene.add(new THREE.Points(geometry, material));
    })();

    /* ════════════════════════════════════════════════════════════
       ANIMATION LOOP
    ════════════════════════════════════════════════════════════ */
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const t = clock.getElapsedTime();

      // Primary Y-axis spin — slow and majestic
      logoGroup.rotation.y = t * 0.38;

      // Gentle breathing tilt on X — gives parallax depth feeling
      logoGroup.rotation.x = Math.sin(t * 0.22) * 0.12;

      // Rim light orbits slightly behind the logo for a sweep highlight
      rimLight.position.x  = Math.cos(t * 0.38) * 180;
      rimLight.position.z  = Math.sin(t * 0.38) * 180 + 80;

      renderer.render(scene, camera);
    }

    animate();

    /* ════════════════════════════════════════════════════════════
       RESPONSIVE  —  update camera + renderer on resize
    ════════════════════════════════════════════════════════════ */
    window.addEventListener('resize', () => {
      camera.aspect = W() / H();
      camera.updateProjectionMatrix();
      renderer.setSize(W(), H());
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    /* ════════════════════════════════════════════════════════════
       REDUCED-MOTION  —  respect user accessibility preference
    ════════════════════════════════════════════════════════════ */
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    if (prefersReducedMotion.matches) {
      // Freeze at a nice angle instead of animating
      logoGroup.rotation.y = 0.45;
      logoGroup.rotation.x = 0.08;
      renderer.render(scene, camera);
    }

  </script>
</body>
</html>
