<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>جارٍ تسجيل الدخول... | بصمجي</title>
    <meta name="robots" content="noindex, nofollow" />
    <!-- Supabase JS SDK — must load before inline script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f0f1a;
            color: #e0d6c8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(212, 168, 64, 0.2);
            border-top-color: #D4A840;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        p {
            font-size: 0.95rem;
            color: #8A7A5A;
        }

        .error {
            color: #E74C3C;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>

<body>
    <div class="spinner"></div>
    <p>جارٍ استكمال تسجيل الدخول...</p>
    <p class="error" id="errorMsg"></p>

    <script type="module">
        import { SUPABASE_URL, SUPABASE_ANON_KEY } from './src/shared/public-config.js';

        // ── localhost-only opener fallback ──────────────────────────────────
        // WHY THIS EXISTS: window.opener is reliably present in production
        // (Vercel/HTTPS), but under `vercel dev` on http://localhost this
        // popup can come back from Google's cross-origin accounts.google.com
        // hop with window.opener already severed by the browser's
        // Cross-Origin-Opener-Policy isolation — a known Chromium behavior
        // for popup-based OAuth (see COOP docs: a cross-origin document
        // opened in a new browsing context group loses window.opener).
        // Without this, the old code below (`if (!window.opener) location =
        // '/'`) treated a severed-but-real opener exactly like a
        // direct-navigation case and self-navigated THIS popup to the
        // homepage — producing a second, already-signed-in tab instead of
        // reporting back to the original one.
        //
        // Fix: this popup and its opener are same-origin (both
        // localhost:8080), so they already share localStorage — the
        // Supabase SDK just wrote the real session there via
        // persistSession:true below. We piggyback a small explicit
        // "handoff" key on top of that same channel: write the result here,
        // and sign-in.js listens for the resulting `storage` event as a
        // fallback alongside its normal postMessage listener. This never
        // fires in production (postMessage always wins there since
        // window.opener stays intact), so production behavior — and the
        // popup UX for real users — is completely unchanged.
        const OAUTH_HANDOFF_KEY = 'bq_oauth_handoff';
        const isLocalhost =
            window.location.hostname === 'localhost' ||
            window.location.hostname === '127.0.0.1';

        function writeLocalHandoff(payload) {
            if (!isLocalhost) return;
            try {
                localStorage.setItem(
                    OAUTH_HANDOFF_KEY,
                    JSON.stringify({ ...payload, ts: Date.now() }),
                );
            } catch (_) { }
        }

        (async function handleOAuthCallback() {
            const hasOpener = !!(window.opener && !window.opener.closed);

            // Only treat this as "opened without an opener at all" (direct
            // navigation, e.g. someone bookmarked this URL) when we're NOT
            // on localhost — there, a missing opener might just be COOP
            // severing a real one, which the handoff-key path above/below
            // still lets us recover from instead of assuming there's no
            // waiting sign-in dialog to report back to.
            if (!hasOpener && !isLocalhost) {
                window.location.href = '/';
                return;
            }

            const targetOrigin = window.location.origin;

            try {
                if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
                    throw new Error('Missing Supabase configuration');
                }

                // NOTE: this file runs in a separate popup window/document
                // (see the window.opener check above) — a different JS realm
                // than the opener page's module graph, so the shared
                // in-memory client registry (supabaseClientRegistry.js)
                // isn't reachable from here; there's no way to reuse the
                // opener's client instance across windows. This IS a second
                // GoTrueClient briefly coexisting with the opener's, but
                // it's short-lived (this window closes within ~1s of success
                // or ~3s on error — see below) rather than persisting for a
                // full page lifetime, so it doesn't reproduce the sustained
                // "Multiple GoTrueClient instances" contention that came
                // from control.js/sign-in.js each creating their own
                // long-lived client on top of the home page's.
                const supabaseClient = window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_ANON_KEY,
                    {
                        auth: {
                            // Let Supabase read the URL hash / code for us
                            detectSessionInUrl: true,
                            persistSession: true,
                        }
                    }
                );

                // getSession() will parse the OAuth code/hash from the URL and
                // exchange it for a real session (PKCE flow or implicit flow).
                // We poll a couple of times in case the SDK needs a moment.
                let session = null;
                for (let i = 0; i < 10; i++) {
                    const { data, error } = await supabaseClient.auth.getSession();
                    if (error) throw error;
                    if (data?.session) { session = data.session; break; }
                    await new Promise(r => setTimeout(r, 300));
                }

                if (!session) {
                    throw new Error('تعذّر الحصول على جلسة بعد تسجيل الدخول');
                }

                // Notify the opener via postMessage when we have a live
                // reference to it (production path, unchanged). Always also
                // write the localhost-only handoff key — harmless/no-op in
                // production (isLocalhost is false there), and the fallback
                // sign-in.js needs on localhost when hasOpener is false.
                if (hasOpener) {
                    window.opener.postMessage(
                        { type: 'BQ_OAUTH_SUCCESS', session },
                        targetOrigin
                    );
                }
                writeLocalHandoff({ type: 'BQ_OAUTH_SUCCESS', session });
                window.close();
            } catch (err) {
                console.error('[oauth-callback] Error:', err);
                // Notify opener of failure so it can reset button state
                if (hasOpener) {
                    try {
                        window.opener.postMessage(
                            { type: 'BQ_OAUTH_ERROR', error: err.message },
                            targetOrigin
                        );
                    } catch (_) { }
                }
                writeLocalHandoff({ type: 'BQ_OAUTH_ERROR', error: err.message });

                const errEl = document.getElementById('errorMsg');
                errEl.textContent = 'حدث خطأ: ' + (err.message || 'غير معروف');
                errEl.style.display = 'block';

                // Close after a short delay so user can see the error
                setTimeout(() => { try { window.close(); } catch (_) { } }, 3000);
            }
        })();
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>

</html>
