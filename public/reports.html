    <!-- Nav avatar anti-flash script -->
    <script>
        (function () {
            try {
                var AVATAR_KEY = "user_avatar_image";
                var PALETTE = ["#2563EB", "#7C3AED", "#DB2777", "#D97706", "#059669", "#DC2626", "#0891B2", "#4F46E5"];

                function colorForName(name) {
                    var str = (name || "?").trim();
                    var hash = 0;
                    for (var i = 0; i < str.length; i++) {
                        hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
                    }
                    return PALETTE[hash % PALETTE.length];
                }

                function initialForName(name) {
                    var str = (name || "").trim();
                    if (!str) return "؟";
                    var diacritics = /[\u064B-\u065F\u0670]/;
                    for (var ch of str) {
                        if (diacritics.test(ch)) continue;
                        return ch.toUpperCase();
                    }
                    return "؟";
                }

                function defaultAvatarDataUrl(name) {
                    var initial = initialForName(name).replace(/&/g, "&amp;").replace(/</g, "&lt;");
                    var color = colorForName(name);
                    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
                        '<rect width="100" height="100" rx="50" fill="' + color + '"/>' +
                        '<text x="50" y="50" font-family="IBM Plex Sans Arabic, sans-serif" font-size="42" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">' + initial + '</text></svg>';
                    return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
                }

                var name = localStorage.getItem("username") || "مستخدم";
                window.__navAvatarDataUrl = localStorage.getItem(AVATAR_KEY) || defaultAvatarDataUrl(name);
            } catch (err) {
                console.error("Nav avatar anti-flash: failed to resolve avatar", err);
            }
        })();
    </script>

    <!-- Inline script to set nav avatars before paint -->
    <script>
        (function () {
            try {
                var targets = [
                    { imgId: "navSidebarAvatar", iconClass: "menu-item-default-icon" },
                    { imgId: "navBottomAvatar", iconClass: "bottom-nav-default-icon" },
                ];
                var src = window.__navAvatarDataUrl;
                if (!src) return;
                targets.forEach(function (t) {
                    var img = document.getElementById(t.imgId);
                    if (!img) return;
                    img.src = src;
                    img.style.display = "";
                    var parent = img.parentElement;
                    if (!parent) return;
                    var icon = parent.querySelector("." + t.iconClass);
                    if (icon) icon.style.display = "none";
                });
            } catch (err) {
                console.error("Nav avatar pre-paint assignment error:", err);
            }
        })();
    </script>
